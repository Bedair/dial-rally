; Dial Rally (repo: motion-quest)
; Target: M5Stack Dial (M5StampS3 / ESP32-S3)

[platformio]
default_envs = m5dial

[env:m5dial]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Dial
    m5stack/M5Unified
    m5stack/M5GFX

; Long-run soak test: the autopilot plays unattended (docs/TESTING.md).
;   pio run -e soak -t upload && pio device monitor -e soak --filter log2file
[env:soak]
extends = env:m5dial
build_flags =
    ${env:m5dial.build_flags}
    -DMQ_SOAK=1
